name: Security CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - security/p3-hardening

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
  
jobs:
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/ai_study_ci
      JWT_ACCESS_SECRET: ci-access-secret-placeholder-000000000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-1111111111111111111
      APP_URL: http://localhost:3000
      EMAIL_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
