services:
  mongo:
    image: mongo:8.0
    container_name: ai-study-mongo
    restart: unless-stopped

    mem_limit: 2048m
    mem_reservation: 256m
    cpus: 2.0
    pids_limit: 256

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand({ ping: 1 }).ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - ai-study-network

  redis:
    image: redis:8-alpine
    container_name: ai-study-redis
    restart: unless-stopped

    mem_limit: 768m
    mem_reservation: 64m
    cpus: 1.0
    pids_limit: 128

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - ai-study-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker

    container_name: ai-study-worker
    restart: unless-stopped
    init: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    mem_limit: 1536m
    mem_reservation: 256m
    cpus: 2.0
    pids_limit: 128

    tmpfs:
      - /tmp:size=256m,mode=1777

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      REDIS_URL: redis://redis:6379
      GENERATION_WORKER_CONCURRENCY: 1

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - ai-study-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner

    container_name: ai-study-app
    restart: unless-stopped
    init: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 128

    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.next/cache:size=128m,mode=1777

    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production

      APP_URL: http://localhost:3000
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}

      REDIS_URL: redis://redis:6379

      HOSTNAME: 0.0.0.0
      PORT: 3000

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - ai-study-network

volumes:
  mongo_data:
  redis_data:

networks:
  ai-study-network:
    driver: bridge