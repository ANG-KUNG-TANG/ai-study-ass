services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ai-study-assistant:latest
    container_name: ai-study-app
    restart: unless-stopped
    init: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    volumes:
      - upload_data:/app/data/uploads

    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: ai-study-assistant-worker:latest
    container_name: ai-study-worker
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      GENERATION_WORKER_CONCURRENCY: 1

  pdf-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: ai-study-assistant-pdf-worker:latest
    container_name: ai-study-pdf-worker
    restart: unless-stopped
    init: true
    command: ["./node_modules/.bin/tsx", "src/server/workers/pdf-ingestion.worker.ts"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - upload_data:/app/data/uploads
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PDF_WORKER_CONCURRENCY: 1

volumes:
  upload_data:
